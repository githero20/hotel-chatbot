<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devfest Chatbot - Devfest Lagos</title>

    <!-- DevFest Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme colors for mobile browsers -->
    <meta name="theme-color" content="#4285f4" />
    <meta name="msapplication-TileColor" content="#4285f4" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <div class="header-content">
          <div class="logo-section">
            <div class="logo">
              <img src="gdg_logo.png" width="100%" height="100%" />
            </div>
            <div class="title-section">
              <h1>DevFest Chatbot</h1>
              <p>Your guide to DevFest Lagos</p>
            </div>
          </div>
          <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Online</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">
          <div class="message-content">
            <div class="message-bubble">
              Welcome to DevFest Lagos! 🚀 I'm here to help you with information
              about the Google Developer Festival. Ask me about speakers,
              sessions, workshops, registration, or anything else about the
              event!
            </div>
            <div class="message-time" id="initialTime"></div>
          </div>
        </div>
      </div>

      <div class="typing-indicator" id="typingIndicator">
        <div class="message bot-message">
          <div class="message-content">
            <div class="typing-bubble">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <form class="chat-input-form" id="chatForm">
          <input
            type="text"
            id="messageInput"
            placeholder="Ask about DevFest speakers, workshops, schedule..."
            autocomplete="off"
            required
          />
          <button type="submit" id="sendButton">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor" />
            </svg>
          </button>
        </form>
        <div class="suggestions" id="suggestions">
          <button class="suggestion-chip" data-message="What is DevFest Lagos?">
            What is DevFest Lagos?
          </button>
          <button
            class="suggestion-chip"
            data-message="When is DevFest happening?"
          >
            When is it happening?
          </button>
          <button
            class="suggestion-chip"
            data-message="What are the available workshops?"
          >
            Workshops available
          </button>
          <button
            class="suggestion-chip"
            data-message="How to register for DevFest?"
          >
            How to register
          </button>
        </div>
      </div>
    </div>

    <script src="dist/script.js"></script>
  </body>
</html>
